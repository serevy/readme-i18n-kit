name: PDDR checkpoint marker

on:
  workflow_run:
    workflows: ["PDDR checkpoint"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  marker:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Collect trusted pull request context
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" \
            | jq '{pull_request: .}' \
            > "$RUNNER_TEMP/pddr-pr-event.json"

          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" \
            --jq '.[].filename' \
            > "$RUNNER_TEMP/pddr-changed-files.txt"

      - name: Recompute checkpoint signal from trusted code
        id: detect
        run: |
          python .pddr/pddr_checkpoint.py \
            --changed-files "$RUNNER_TEMP/pddr-changed-files.txt" \
            --event-path "$RUNNER_TEMP/pddr-pr-event.json" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --marker "$RUNNER_TEMP/pddr-checkpoint.md"

      - name: Add pending marker to pull request
        if: steps.detect.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set +e

          marker="$(cat "$RUNNER_TEMP/pddr-checkpoint.md")"
          body="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.body // ""' 2>/dev/null)"

          if printf '%s\n' "$body" | grep -qi '^## PDDR checkpoint'; then
            exit 0
          fi

          new_body="$body"
          if [ -n "$new_body" ]; then
            new_body="$new_body"$'\n\n'"$marker"
          else
            new_body="$marker"
          fi

          if gh api -X PATCH "repos/$GH_REPO/pulls/$PR_NUMBER" -f body="$new_body" >/dev/null 2>&1; then
            exit 0
          fi

          existing_comment_id="$(
            gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.body | contains("<!-- pddr-checkpoint-signal -->")) | .id' \
              2>/dev/null | head -n 1
          )"

          if [ -n "$existing_comment_id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing_comment_id" \
              -f body="$marker" >/dev/null 2>&1
          else
            gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              -f body="$marker" >/dev/null 2>&1
          fi

          # If repository policy prevents writes, the read-only pull_request
          # workflow summary remains the durable signal trace.
          exit 0
