name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20.19.0'

      - name: Test request guard
        run: node --test scripts/translation-fetch-guard.test.mjs

      - name: Compile Python helpers
        run: python -m py_compile scripts/prepare-readme-i18n.py scripts/verify-readme-translation.py

      - name: Smoke-test configuration preparation
        run: |
          set -eu
          python scripts/prepare-readme-i18n.py             --config config.example.json             --source-file README.md             --source-language ja             --target all             --settings-out "$RUNNER_TEMP/settings.json"             --targets-out "$RUNNER_TEMP/targets.txt"             --meta-out "$RUNNER_TEMP/meta.json"

          test -s "$RUNNER_TEMP/settings.json"
          test -s "$RUNNER_TEMP/targets.txt"
          test -s "$RUNNER_TEMP/meta.json"

      - name: Smoke-test generic verifier
        run: python scripts/verify-readme-translation.py README.md README.md config.example.json
